<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bank link – Jor Personal Tools</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:6px}button{margin-top:12px;padding:8px 16px;font-size:16px}</style>
</head>
<body>
<h1>Bank link</h1>
<p id="msg">Reading the result…</p>
<code id="code"></code>
<button id="copy" hidden>Copy code</button>
<script>
const p = new URLSearchParams(location.search);
const msg = document.getElementById('msg'), box = document.getElementById('code'), btn = document.getElementById('copy');
if (p.get('code')) {
  msg.textContent = 'Bank approved. Copy this code and paste it into the jorFinance script on your Mac:';
  box.textContent = p.get('code');
  btn.hidden = false;
  btn.onclick = () => navigator.clipboard.writeText(p.get('code')).then(() => btn.textContent = 'Copied');
} else {
  msg.textContent = 'No code received. ' + (p.get('error') ? 'Error: ' + p.get('error') + ' ' + (p.get('error_description') || '') : 'Start the bank link again from the script.');
  box.hidden = true;
}
</script>
</body>
</html>
